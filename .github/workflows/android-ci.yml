name: CHROMECORE X — Android CI/CD

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install Android platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compile Kotlin
        run: gradle compileDebugKotlin --no-daemon 2>&1 | tail -100

      - name: Assemble debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace > build_output.log 2>&1 || true
          echo "=== LAST 100 LINES ==="
          tail -100 build_output.log
          echo "=== ERRORS ==="
          grep -i "error\|FAILED\|exception" build_output.log | head -30 || echo "No errors found"

      - name: List APK outputs
        run: |
          echo "=== APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || true
          echo "=== Debug APK dir ==="
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "Dir not found (APK may be elsewhere)"
          find app/build -name "*.apk" 2>/dev/null || true

      - name: Verify APK
        run: |
          APK=$(find app/build -name "*.apk" -path "*/debug/*" -type f -print -quit 2>/dev/null)
          if [ -z "$APK" ]; then
            echo "ERROR: No debug APK found"
            find app/build -type f -name "*.apk" 2>/dev/null || echo "No APKs anywhere"
            exit 1
          fi
          echo "APK: $APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" -print -quit)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found"
            exit 1
          fi
          echo "APK: $APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromecore-x-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            build_output.log
          retention-days: 14

  assemble-release:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install Android platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Assemble release APK
        run: gradle assembleRelease --no-daemon 2>&1 | tail -100

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: chromecore-x-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
