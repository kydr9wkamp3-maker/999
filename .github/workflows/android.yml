name: CHROMECORE X — Android CI/CD

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Preflight
        run: bash scripts/preflight.sh

      - name: Compile Kotlin
        run: ./gradlew compileDebugKotlin --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK and list outputs
        run: |
          echo "=== All APKs ==="
          find . -name '*.apk' -type f 2>/dev/null
          echo "=== app/build/outputs ==="
          find app/build/outputs -type f 2>/dev/null || echo "No outputs dir"
          APK=$(find app/build/outputs -name '*.apk' -type f | head -1)
          test -n "$APK" || { echo "APK not found"; exit 1; }
          ls -lh "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: chromecore-x-debug-apk
          path: app/build/outputs/**/*.apk
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
